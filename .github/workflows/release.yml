# Compila Zeuz Agent en Windows y macOS (nativo, sin compilacion cruzada) y
# publica ambos binarios en un GitHub Release.
#
# Se dispara al empujar una etiqueta "vX.Y.Z" (crea el release con los
# instaladores) o a mano con "Run workflow" (solo compila y deja los
# artefactos descargables de la corrida, sin publicar release).
#
# Los nombres de los archivos (ZeuzAgent.exe y ZeuzAgent-macOS.zip) deben
# coincidir con los enlaces de la pagina de descargas, que apunta a
#   https://github.com/ElEduardoCR/zeuzagent/releases/latest/download/<archivo>
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de empaquetado
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm --clean packaging/zeuzagent.spec

      # Windows: el .exe queda directo en dist\.
      - name: Empaquetar Windows
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "dist/ZeuzAgent.exe")) { throw "No se genero dist/ZeuzAgent.exe" }

      # macOS: se comprime el bundle .app con ditto para conservar permisos
      # y firma ad-hoc del bundle.
      - name: Empaquetar macOS
        if: runner.os == 'macOS'
        run: |
          if [ ! -d "dist/Zeuz Agent.app" ]; then echo "No se genero el .app"; exit 1; fi
          ditto -c -k --keepParent "dist/Zeuz Agent.app" "dist/ZeuzAgent-macOS.zip"

      - name: Subir artefacto Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ZeuzAgent.exe
          if-no-files-found: error

      - name: Subir artefacto macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ZeuzAgent-macOS.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # always(): publica el release aunque una plataforma no haya compilado
    # (p. ej. cuando GitHub no asigna runner de macOS y cancela ese job). Asi
    # un tag siempre produce un release con lo que si esta disponible, en vez
    # de tumbar todo por una plataforma faltante.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir binarios disponibles
        run: |
          mkdir -p out
          found=0
          for f in artifacts/windows/ZeuzAgent.exe artifacts/macos/ZeuzAgent-macOS.zip; do
            if [ -f "$f" ]; then cp "$f" out/; found=$((found+1)); fi
          done
          echo "Binarios encontrados: $found"
          ls -la out
          if [ "$found" -eq 0 ]; then
            echo "::error::Ningun binario disponible para publicar"; exit 1
          fi

      - name: Publicar release (crea o agrega binarios)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Zeuz Agent ${GITHUB_REF_NAME}" \
              --generate-notes \
              out/*
          fi
