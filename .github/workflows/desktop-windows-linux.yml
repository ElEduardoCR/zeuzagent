name: Desktop Windows y Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "scripts/build_desktop*"
      - "pyproject.toml"
      - ".github/workflows/desktop-windows-linux.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows primero
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar y probar Windows
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "No se pudo preparar Python" }
          ./scripts/build_desktop.ps1
      - name: Guardar ejecutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: ZeuzAgent-Windows-x86_64
          path: |
            dist/ZeuzAgent.exe
            dist/ZeuzAgent.exe.sha256
          if-no-files-found: error

  linux:
    name: Linux después de Windows
    needs: windows
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas de escritorio Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Compilar y probar Linux
        run: sh ./scripts/build_desktop.sh
      - name: Guardar paquete Linux
        uses: actions/upload-artifact@v4
        with:
          name: ZeuzAgent-Linux-x86_64
          path: |
            dist/ZeuzAgent-linux-x86_64.tar.gz
            dist/ZeuzAgent-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
