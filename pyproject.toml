[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zeuzagent"
version = "0.4.1"
description = "Puente local multiplataforma para el ecosistema Zeuz"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Zeuz" }]
dependencies = [
  "zeroconf>=0.132,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
desktop = ["PySide6>=6.7,<7"]
package = [
  "PyInstaller>=6,<7",
  "PySide6>=6.7,<7",
]

[project.scripts]
zeuzagent = "zeuzagent.__main__:main"
zeuzagent-ui = "zeuzagent.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zeuzagent = ["qml/*.qml", "assets/*.svg", "assets/*.png", "assets/*.icns", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
